[project]
name = "learned-vs-measured-histology"
version = "0.1.0"
description = "Do foundation model embeddings or segmentation-based morphometry predict spatial gene expression better in non-neoplastic human kidney, and how much does the answer depend on the segmenter?"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Ahmad Mohammad", email = "ahmad.mmd26@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "shapely>=2.0",
    "tifffile>=2024.2",
    "h5py>=3.10",
    "torch>=2.2",
    "timm>=1.0",
    "huggingface_hub>=0.23",
    "mlflow>=2.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_data: needs KPMP Visium sections linked under data/kpmp",
]
